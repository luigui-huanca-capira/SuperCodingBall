<main class="home-page">
  <section class="home-layout" aria-label="Menu principal">
    <div class="home-brand">
      <img class="home-logo oriented-icon" src="assets/app-icons/icon-512x512.png" alt="">
      <h1 class="home-title">SuperCodingBall</h1>
      <p class="home-motto">{{"HOME.MOTTO" | translate }}</p>
    </div>

    <nav class="home-menu">
      <button
        type="button"
        class="btn btn-primary home-action home-action-primary"
        routerLink="/offline-opponents">
        {{"HOME.BUTTON_PLAY_OFFLINE" | translate }}
      </button>

      <div class="home-secondary-actions">
        <button
          type="button"
          class="btn btn-warning home-action"
          routerLink="/howto">
          {{"HOME.BUTTON_HOW_TO" | translate }}
        </button>

        <button
          type="button"
          class="btn btn-outline-dark home-action"
          routerLink="/about">
          {{"HOME.BUTTON_ABOUT" | translate }}
        </button>
      </div>
    </nav>
  </section>
</main>
